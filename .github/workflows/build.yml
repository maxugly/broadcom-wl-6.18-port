name: Jules Build Check
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v25
      - name: Setup XanMod Headers
        run: sudo ./setup-jules.sh
      - name: Build Module
        run: nix develop --command bash -c "make CC=clang LLVM=1 KBASE=/lib/modules/6.18.18-x64v2-xanmod1"